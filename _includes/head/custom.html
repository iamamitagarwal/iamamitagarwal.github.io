<!-- Prevent FOUC: apply saved theme ASAP -->
<script>
  (function() {
    try {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('theme-dark');
      }
    } catch(e){}
  })();
</script>

<style>

    width: 200px !important;      /* pick 180–220px to taste */
    height: 200px !important;
    max-width: none !important;   /* override theme cap */
    border-radius: 50%;
    object-fit: cover;            /* crop nicely inside the circle */
    display: block;
  }
  .sidebar .author__avatar{
    display: flex;                /* avoids odd centering */
    align-items: center;
  }

   /* Mobile avatar clamp + spacing so it never overlaps the title/bar */

    /* keep the masthead above everything */
    .masthead{ z-index: 2000; }

    /* a little breathing room under the hero */
    .page__sidebar{ margin-top: 10px !important; overflow: hidden; }

    .page__sidebar .author__avatar,

      width:112px !important;
      height:112px !important;

<script>
  /* Solid sticky masthead with shadow after scroll */
  (function(){
    var h = document.querySelector('.masthead');
    if(!h) return;
    var on = () => h.classList.toggle('is-stuck', window.scrollY > 8);
    on(); window.addEventListener('scroll', on, {passive:true});
  })();

  /* Copy BibTeX pill */
  document.addEventListener('click', e=>{
    const b = e.target.closest('.pill--copy');
    if(!b) return;
    const txt = b.dataset.bib || '';
    navigator.clipboard.writeText(txt).then(()=>{
      b.dataset.label = b.textContent;
      b.textContent = 'Copied!';
      setTimeout(()=>{ b.textContent = b.dataset.label || 'BibTeX'; }, 900);
    });
  });

  /* Theme toggle: create if missing, then place it in masthead next to search */
  (function(){
    let btn = document.getElementById('theme-toggle');
    if(!btn){
      btn = document.createElement('button');
      btn.id = 'theme-toggle';
      btn.type = 'button';
      btn.textContent = '🌙';
    }
    const setIcon = () => {
      btn.textContent = document.documentElement.classList.contains('theme-dark') ? '☀️' : '🌙';
    };
    btn.addEventListener('click', ()=>{
      const dark = document.documentElement.classList.toggle('theme-dark');
      try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch(e){}
      setIcon();
    });
    setIcon();

    function place(){
      const nav = document.querySelector('.masthead .greedy-nav');
      if(!nav) return false;
      const anchor = nav.querySelector('.search__toggle') || nav.querySelector('.site-search');
      if (anchor && anchor.parentNode){
        anchor.parentNode.insertBefore(btn, anchor.nextSibling);
      } else {
        (nav.querySelector('.visible-links') || nav).appendChild(btn);
      }
      return true;
    }
    if (!place()) window.addEventListener('load', place);
  })();
</script>
