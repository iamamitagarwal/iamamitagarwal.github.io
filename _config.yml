# --- Site identity ---
title: "Amit Agarwal — Applied AI Research"
logo: /images/logo.png                                    # keep text brand in header
masthead_title: "Amit Agarwal"
brand_sub: "Senior Principal Applied Scientist, Oracle AI (OCI, Oracle) · ML/LLMs & cloud-scale systems"
title_separator: " | "                      # change to " | " or "" if you insist
locale: en
timezone: America/Los_Angeles

name: "Amit Agarwal"
description: "Amit Agarwal is a Senior Principal Applied Scientist at Oracle Cloud Infrastructure, working across AI agents, search and knowledge systems, multimodal and document intelligence, and evaluation."
keywords:
  - "Amit Agarwal"
  - "Amit"
  - "Amit Oracle"
  - "Amit Abzooba"
  - "Amit AIESEC"
  - "Agarwal Amit"
  - "Amit AI"
  - "iamamitagarwal"
  - "Amit Agarwal Oracle"
  - "Amit Agarwal AI"
  - "Oracle AI"
  - "OCI"
  - "LLM"
  - "GenAI"
  - "Agentic AI"
  - "AI agents"
  - "AI automation"
  - "Prompt engineering"
  - "RAG"
  - "Retrieval"
  - "Evaluation"
  - "Document AI"
  - "Multilingual"
  - "Multimodal"
  - "Alignment"
  - "Reasoning"
  - "AI safety"
  - "Responsible AI"
  - "On-device AI"
  - "Small models"
url: https://iamamitagarwal.github.io
baseurl: ""

# The same pinned 4.24.0 theme is installed by Gemfile for local and CI builds.
theme: minimal-mistakes-jekyll
minimal_mistakes_skin: air

search: true
search_full_content: true

og_image: /images/og-card.png

twitter:
  username: amitpinaki

social:
  name: "Amit Agarwal"
  links:
    - "https://www.linkedin.com/in/amitagarwal6/"
    - "https://scholar.google.com/citations?user=Mc9RC6QAAAAJ&hl=en"
    - "https://github.com/iamamitagarwal"

analytics:
  provider: "false"

markdown: kramdown
permalink: /:categories/:title/
include:
  - _pages

# Development records and build output are not public profile content.
exclude:
  - files/amit-agarwal-research-leadership-resume.pdf
  - AGENTS.md
  - CLAUDE.md
  - PROJECT_MEMORY.md
  - README.md
  - file.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - _site
  - output
  - .agent-notes
  - .claude
  - .codex
  - .github
  - .playwright-cli
  - .jekyll-cache
  - .jekyll-metadata

plugins:
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-feed

author:
  name: "Amit Agarwal"
  avatar: "/images/profile.jpeg"
  bio: "Senior Principal Applied Scientist at Oracle AI (OCI, Oracle)."
  location: "Seattle, WA"
  links:
    - label: "Oracle Cloud Infrastructure"
      icon: "fas fa-building"
      url: "https://www.oracle.com/cloud/"
    - label: "X (Twitter)"
      icon: "fab fa-x-twitter"
      url: "https://x.com/amitpinaki"
    - label: "Email"
      icon: "fas fa-envelope"
      url: "mailto:amit.pinaki@gmail.com"
    - label: "Google Scholar"
      icon: "fas fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=Mc9RC6QAAAAJ&hl=en"
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://www.linkedin.com/in/amitagarwal6/"
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/iamamitagarwal"

defaults:
  - scope: { path: "", type: pages }
    values: { layout: single, author_profile: true, search: true }
  - scope: { path: "", type: posts }
    values: { layout: single, author_profile: true, search: true }
  - scope: { path: "", type: publications }
    values: { layout: single, author_profile: true, search: true, classes: wide }
  - scope: { path: "", type: patents }
    values: { layout: single, author_profile: true, search: true, classes: wide }
  - scope: { path: "", type: awards }
    values: { layout: single, author_profile: true, classes: wide }
  - scope: { path: "", type: media }
    values: { layout: single, author_profile: true, classes: wide }

collections:
  publications:
    output: true
    permalink: /publications/:path/
  patents:
    output: true
    permalink: /patents/:path/
  talks:
    output: true
    permalink: /talks/:path/
  awards:
    output: true
    permalink: /awards/:path/
  media:
    output: true
    permalink: /media/:path/
