<!doctype html>
<html lang="{{ site.locale | default: 'en' | split: '-' | first }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include seo.html %}
  <link rel="stylesheet" href="{{ '/assets/css/profile-home.css' | relative_url }}">
  <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}" sizes="any">
  <link rel="apple-touch-icon" href="{{ '/images/apple-touch-icon.png' | relative_url }}">
  <link rel="describedby" href="{{ '/llms.txt' | absolute_url }}" type="text/plain">
  <link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | absolute_url }}" title="{{ site.title | escape }}">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-351QZEBS4T"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date()); gtag('config', 'G-351QZEBS4T');
  </script>
</head>
<body>{{ content }}</body>
</html>
