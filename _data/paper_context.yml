2025-rci-a-score-for-evaluating-global-and-local-reasoning-in-multimodal-benchmarks:
  summary: RCI examines whether vision-language benchmarks require whole-image reasoning by comparing reference-model
    performance on image patches and full images.
  terms:
  - multimodal large language models
  - vision-language benchmarks
  - global and local visual reasoning
  - image-patch evaluation
2025-pcri-measuring-context-robustness-in-multimodal-models-for-enterprise-applicatio:
  summary: PCRI measures sensitivity to distracting visual context through patch-versus-full-image comparisons of
    19 multimodal models across 15 vision-language benchmarks, including InternVL2-26B and Qwen2VL-72B.
  terms:
  - multimodal large language models
  - visual context robustness
  - InternVL2-26B
  - Qwen2VL-72B
  - image-patch evaluation
2026-do-image-text-metrics-respect-semantic-invariances:
  summary: This study tests reference-free image–text evaluators under meaning-preserving changes to images and
    captions, and proposes invariance-calibrated scoring.
  terms:
  - image–text evaluation
  - semantic invariance
  - caption alignment
  - invariance calibration
2024-mvtamperbench-evaluating-robustness-of-vision-language-models:
  summary: MVTamperBench evaluates video-understanding robustness in 45 multimodal models using rotation, masking,
    substitution, repetition and dropping perturbations.
  terms:
  - multimodal large language models
  - video understanding
  - spatial and temporal coherence
  - tampering robustness
2025-accesseval-benchmarking-disability-bias-in-large-language-models:
  summary: AccessEval compares neutral and disability-aware queries across 21 language models, measuring factual
