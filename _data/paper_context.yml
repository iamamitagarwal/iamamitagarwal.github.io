  terms:
  - conversational retrieval
  - multi-turn search
  - retrieval reasoning
  - evidence retrieval
2025-benchhub-a-unified-benchmark-suite-for-holistic-and-customizable-llm-evaluation:
  summary: BenchHub makes benchmark composition explicit through instance-level attributes, enabling controlled
